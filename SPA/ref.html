<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliothèque - Gestion de livres</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

  <!-- En-tête / Header ton froid -->
  <header class="bg-slate-900 text-slate-100 py-6 shadow-md border-b border-slate-800">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl"></span>
        <div>
          <h1 class="text-2xl font-bold tracking-wide">Mon Coin Lecture</h1>
          <p class="text-xs text-slate-400">Organisez et savourez vos lectures</p>
        </div>
      </div>
      <span class="text-sm bg-slate-800 text-cyan-300 px-3.5 py-1.5 rounded-full font-medium shadow-inner border border-slate-700" id="book-count">0 livres</span>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Section Formulaire (1 colonne) -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold mb-4 text-slate-900 border-b pb-2 border-slate-100" id="form-title">Ajouter un livre</h2>
      
      <form id="book-form" class="space-y-4">
        <!-- Champ caché pour stocker l'ID en mode édition -->
        <input type="hidden" id="book-id">

        <div>
          <label for="title" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Titre *</label>
          <input type="text" id="title" required placeholder="Ex: L'Alchimiste"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition">
        </div>

        <div>
          <label for="author" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Auteur *</label>
          <input type="text" id="author" required placeholder="Ex: Paulo Coelho"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="year" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Année</label>
            <input type="number" id="year" placeholder="1988"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition">
          </div>
          <div>
            <label for="genre" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Genre</label>
            <input type="text" id="genre" placeholder="Ex: Roman"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label for="status" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Statut</label>
          <select id="status" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition">
            <option value="to-read">À lire</option>
            <option value="reading">En cours</option>
            <option value="read">Lu</option>
          </select>
        </div>

        <div>
          <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Description</label>
          <textarea id="description" rows="3" placeholder="Quelques mots sur le livre..."
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition"></textarea>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-slate-900 text-white font-medium py-3 rounded-xl hover:bg-slate-800 shadow-sm hover:shadow transition duration-200">
          Ajouter à la bibliothèque
        </button>
      </form>
    </section>

    <!-- Section Liste & Filtres (2 colonnes) -->
    <section class="lg:col-span-2 space-y-6">
      
      <!-- Barre de recherche et tri -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-4 justify-between items-center">
        <div class="w-full sm:flex-1">
          <input type="text" id="search-input" placeholder="🔍 Rechercher par titre ou auteur..."
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition">
        </div>
        <div class="w-full sm:w-auto">
          <select id="sort-select" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none transition text-sm">
            <option value="title">Trier par Titre</option>
            <option value="author">Trier par Auteur</option>
            <option value="year">Trier par Année</option>
          </select>
        </div>
      </div>

      <!-- Conteneur de la liste des livres -->
      <div id="books-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Exemple de carte de livre (style tons froids) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <h3 class="text-lg font-bold text-slate-900">L'Alchimiste</h3>
              <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap border border-emerald-200">Lu</span>
            </div>
            <p class="text-xs text-slate-500 mb-2 font-medium">Par <span class="text-slate-800">Paulo Coelho</span> • 1988</p>
            <span class="inline-block bg-slate-100 text-slate-700 text-xs px-2.5 py-0.5 rounded-md mb-3 font-medium">Roman philosophique</span>
            <p class="text-sm text-slate-600 line-clamp-2 mb-4 leading-relaxed">L'histoire de Santiago, un jeune berger Andalou qui part à la recherche d'un trésor égyptien...</p>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
            <button class="px-3 py-1.5 text-xs font-medium bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition">Modifier</button>
            <button class="px-3 py-1.5 text-xs font-medium bg-rose-50 text-rose-700 rounded-lg hover:bg-rose-100 transition">Supprimer</button>
          </div>
        </div>

      </div>

    </section>
  </main>

  <!-- Module JS principal -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
